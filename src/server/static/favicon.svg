<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Clipboard body -->
  <rect x="3" y="2" width="16" height="21" rx="2" fill="#1d70b8"/>
  <!-- Clip at top -->
  <rect x="8" y="0.5" width="6" height="4.5" rx="1.5" fill="#003078"/>
  <!-- Content lines -->
  <rect x="6" y="9" width="10" height="1.5" rx="0.75" fill="rgba(255,255,255,0.5)"/>
  <rect x="6" y="13" width="8" height="1.5" rx="0.75" fill="rgba(255,255,255,0.5)"/>
  <!-- Magnifier glass (white fill to contrast against clipboard overlap) -->
  <circle cx="21" cy="23" r="6" fill="white" stroke="#1d70b8" stroke-width="2"/>
  <!-- Handle -->
  <line x1="25.2" y1="27.2" x2="29" y2="31" stroke="#1d70b8" stroke-width="3" stroke-linecap="round"/>
</svg>
