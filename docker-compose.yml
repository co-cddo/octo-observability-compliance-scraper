services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper
      POSTGRES_DB: compliance_scraper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d compliance_scraper"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://scraper:scraper@postgres:5432/compliance_scraper
      AWS_REGION: eu-west-2
      BEDROCK_MODEL_ID: eu.anthropic.claude-haiku-4-5-20251001-v1:0
      SERVICES_JSON_PATH: /app/services.json
      SEED_DATABASE: "true"
      NODE_ENV: development
      APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    healthcheck:
      test: curl -f http://localhost:3000/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  e2e-test:
    profiles: [test]
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    working_dir: /app
    depends_on:
      app:
        condition: service_healthy
    environment:
      CI: "true"
      PLAYWRIGHT_BASE_URL: http://app:3000
    volumes:
      - .:/app
      - e2e-node-modules:/app/node_modules
      - ./playwright-report:/app/playwright-report
    command: >
      bash -c "npm install -g $$(npm pkg get packageManager | tr -d '\"')
      && pnpm install --frozen-lockfile
      && pnpm exec playwright test"

volumes:
  postgres_data:
  e2e-node-modules:
